const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function S(i){return state[i]||{status:'Pendente',diffs:[],extra:'',obs:'',saved:false}}
function persist(){state._idx=idx;localStorage.setItem(KEY,JSON.stringify(state));stats()}
function stats(){let a=0,b=0,c=0,d=0;DATA.forEach((_,i)=>{let s=S(i).status;if(s==='Confere')a++;else if(s==='Divergente')b++;else if(s==='Não localizado')c++;else d++});$('p1').textContent='Total: '+DATA.length;$('p2').textContent='✓ '+a;$('p3').textContent='! '+b;$('p4').textContent='⌖ '+c;$('p5').textContent='Pendentes: '+d}
function F(l,v,w=false,cl=''){return `<div class="f ${w?'wide':''}"><div class="lab">${esc(l)}</div><div class="val ${cl}">${esc(v)||'—'}</div></div>`}
function render(){
 let r=DATA[idx],s=S(idx);$('card').innerHTML=`<div class="card"><div class="rowtop"><div class="num">#${esc(r['Nº'])} <small>de ${DATA.length}</small></div><div class="badge">${esc(s.status)}</div></div><div class="name">${esc(r['Nome/Razão Social'])}</div>
 <div class="section first">Dados recebidos</div><div class="grid">${F('Conta',r['Conta'])}${F('Quadra/Lote',r['Quadra/Lote'])}${F('Medidor',r['Medidor'],true,'meter')}${F('CPF/CNPJ',r['CPF/CNPJ'])}${F('Telefone',r['Telefone'])}${F('Emite Conta',r['Emite Conta'],true)}</div>
 <div class="section">Conferência em campo</div><div class="actions"><button class="ok ${s.status==='Confere'?'sel':''}" onclick="setStatus('Confere')">✓ Confere</button><button class="bad ${s.status==='Divergente'?'sel':''}" onclick="setStatus('Divergente')">! Divergente</button><button class="nf ${s.status==='Não localizado'?'sel':''}" onclick="setStatus('Não localizado')">⌖ Não localizado</button></div>
 <div id="divBlock" class="block ${s.status==='Divergente'?'show':''}"><h3>Bloco de divergência</h3><div id="diffList"></div><button class="btn add" onclick="addDiff()">＋ Adicionar divergência</button></div>
 <div id="obsBlock" class="block ${s.status==='Não localizado'?'show':''}"><h3>Não localizado</h3><label>Observação<textarea id="notFoundObs">${esc(s.notFoundObs||'')}</textarea></label></div>
 <button class="btn add" onclick="toggleExtra()">＋ Adicionar informação</button>
 <div id="extraBlock" class="block ${s.extra||s.obs?'show':''}"><h3>Informação complementar</h3><label>Informação nova / complementar<textarea id="extra">${esc(s.extra||'')}</textarea></label><label>Observação<textarea id="obs">${esc(s.obs||'')}</textarea></label></div>
 <button class="btn save" onclick="saveRecord()">SALVAR REGISTRO</button><div id="saved" class="saved">${s.saved?'✓ Registro salvo':''}</div></div>`;
 renderDiffs();$('prev').disabled=idx===0;$('next').disabled=idx===DATA.length-1
}
window.setStatus=x=>{let s=S(idx);s.status=x;s.saved=false;if(x==='Divergente'&&!s.diffs.length)s.diffs=[{field:'Medidor',found:''}];state[idx]=s;persist();render()}
window.addDiff=()=>{let s=S(idx);s.diffs=s.diffs||[];s.diffs.push({field:'Medidor',found:''});s.saved=false;state[idx]=s;persist();render()}
function renderDiffs(){let s=S(idx),r=DATA[idx],box=$('diffList');if(!box)return;box.innerHTML=(s.diffs||[]).map((d,j)=>`<div class="diff"><label>Campo<select data-j="${j}" class="df">${['Medidor','Quadra/Lote','Nome/Razão Social','Conta','CPF/CNPJ','Telefone','Emite Conta','Outro'].map(x=>`<option ${d.field===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label>Encontrado<input data-j="${j}" class="dv" type="text" value="${esc(d.found)}" placeholder="Valor encontrado"></label><div class="orig wide"><b>Informado:</b> ${esc(r[d.field]||'—')}</div></div>`).join('');
 document.querySelectorAll('.df').forEach(e=>e.onchange=()=>{let s=S(idx);s.diffs[+e.dataset.j].field=e.value;s.saved=false;state[idx]=s;persist();renderDiffs()});
 document.querySelectorAll('.dv').forEach(e=>e.oninput=()=>{let s=S(idx);s.diffs[+e.dataset.j].found=e.value;s.saved=false;state[idx]=s;persist()})
}
window.toggleExtra=()=>{$('extraBlock').classList.toggle('show')}
window.saveRecord=()=>{let s=S(idx);if($('extra'))s.extra=$('extra').value;if($('obs'))s.obs=$('obs').value;if($('notFoundObs'))s.notFoundObs=$('notFoundObs').value;s.saved=true;state[idx]=s;persist();$('saved').textContent='✓ Registro salvo'}
$('prev').onclick=()=>{if(idx>0){idx--;render();scrollTo(0,0)}};$('next').onclick=()=>{if(idx<DATA.length-1){idx++;render();scrollTo(0,0)}};
$('q').oninput=()=>{let x=$('q').value.trim().toLowerCase();if(!x){$('results').style.display='none';return}let f=DATA.map((r,i)=>[r,i]).filter(([r])=>Object.values(r).join(' ').toLowerCase().includes(x));$('results').style.display='block';$('results').innerHTML=f.length?f.slice(0,100).map(([r,i])=>`<div class="result" data-i="${i}"><b>#${esc(r['Nº'])} — ${esc(r['Nome/Razão Social'])}</b>${esc(r['Quadra/Lote'])} • ${esc(r['Medidor'])} • Conta ${esc(r['Conta'])}</div>`).join(''):'<div class="result">Nenhum registro encontrado.</div>';document.querySelectorAll('.result[data-i]').forEach(e=>e.onclick=()=>{if(sequenceBeforeSearch===null)sequenceBeforeSearch=idx;idx=+e.dataset.i;$('results').style.display='none';$('q').value='';$('backSearch').style.display='block';$('backSearch').textContent='← Voltar para a vistoria — Card '+(sequenceBeforeSearch+1);render();scrollTo(0,0)})};
$('backSearch').onclick=()=>{if(sequenceBeforeSearch!==null){idx=sequenceBeforeSearch;sequenceBeforeSearch=null;$('backSearch').style.display='none';render();scrollTo(0,0)}};
function report(){let ok=0,bad=0,nf=0,pend=0,E=[];DATA.forEach((r,i)=>{let s=S(i);if(s.status==='Confere')ok++;else if(s.status==='Divergente')bad++;else if(s.status==='Não localizado')nf++;else pend++;if(s.status!=='Confere'||s.extra||s.obs){let ds=(s.diffs||[]).filter(x=>x.found).map(x=>esc(x.field)+': '+esc(x.found)).join(' | ');E.push(`<div class="entry"><b>#${esc(r['Nº'])} — ${esc(r['Nome/Razão Social'])}</b><br><span class="mut">Conta:</span> ${esc(r['Conta'])} &nbsp; <span class="mut">Quadra/Lote:</span> ${esc(r['Quadra/Lote'])} &nbsp; <span class="mut">Medidor:</span> ${esc(r['Medidor'])}<br><b>Resultado:</b> ${esc(s.status)}${ds?'<br><b>Encontrado:</b> '+ds:''}${s.notFoundObs?'<br><b>Observação:</b> '+esc(s.notFoundObs):''}${s.extra?'<br><b>Informação complementar:</b> '+esc(s.extra):''}${s.obs?'<br><b>Observação:</b> '+esc(s.obs):''}</div>`)}});$('report').innerHTML=`<h1>Relatório de Conferência — Esplanada</h1><p>Emitido em ${new Date().toLocaleString('pt-BR')}</p><div class="sum"><div class="box"><b>Total</b><br>${DATA.length}</div><div class="box"><b>Confere</b><br>${ok}</div><div class="box"><b>Divergentes</b><br>${bad}</div><div class="box"><b>Não localizados</b><br>${nf}</div><div class="box"><b>Pendentes</b><br>${pend}</div></div><h2>Ocorrências e informações de campo</h2>${E.length?E.join(''):'<p>Nenhuma ocorrência registrada.</p>'}`;window.print()}
$('reportBtn').onclick=report;stats();render();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script></body></html>
